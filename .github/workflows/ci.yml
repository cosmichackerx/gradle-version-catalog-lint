name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build and smoke-test the wheel
        run: |
          python -m pip install build
          python -m build
          python -m pip install dist/*.whl
          catalog-lint --version
          catalog-lint --list-rules

  action-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Run the composite action on the example project (findings expected, never fails)
        uses: ./
        with:
          path: examples/android-app
          fail-on: never
          format: sarif
          output-file: catalog-lint.sarif
      - name: Report is valid SARIF with results
        run: python -c "import json; d=json.load(open('catalog-lint.sarif')); assert d['runs'][0]['results']"
      - name: Example project must fail the default gate
        run: |
          python -m pip install .
          if catalog-lint examples/android-app > /dev/null; then echo "expected exit 1" >&2; exit 1; fi
