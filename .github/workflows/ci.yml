name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest

  claims:
    name: README claims (claims-check)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cosmichackerx/claims-check@v0.1.1

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build and smoke-test the wheel
        run: |
          python -m pip install build
          python -m build
          python -m pip install dist/*.whl
          catalog-lint --version
          catalog-lint --list-rules

  action-selftest:
    name: action-selftest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the composite action on the example project (findings expected, never fails)
        uses: ./
        with:
          path: examples/android-app
          fail-on: never
          format: sarif
          output-file: catalog-lint.sarif
      - name: Report is valid SARIF with results
        run: python -c "import json; d=json.load(open('catalog-lint.sarif')); assert d['runs'][0]['results']"
      - name: Example project must fail the default gate
        run: |
          python -m pip install .
          if catalog-lint examples/android-app > /dev/null; then echo "expected exit 1" >&2; exit 1; fi

  precommit-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install pre-commit
      - name: Hook fails on a project with findings
        run: |
          work="$(mktemp -d)"
          cp -r examples/android-app/. "$work"
          cd "$work"
          git init -q && git add -A
          git -c user.email=ci@example.com -c user.name=ci commit -qm init
          if pre-commit try-repo "$GITHUB_WORKSPACE" catalog-lint --all-files; then
            echo "expected the hook to fail" >&2; exit 1
          fi
      - name: Hook passes on a clean project
        run: |
          work="$(mktemp -d)"
          mkdir -p "$work/gradle"
          printf '[libraries]\na = "g:a:1"\n' > "$work/gradle/libs.versions.toml"
          echo 'dependencies { implementation(libs.a) }' > "$work/build.gradle.kts"
          cd "$work"
          git init -q && git add -A
          git -c user.email=ci@example.com -c user.name=ci commit -qm init
          pre-commit try-repo "$GITHUB_WORKSPACE" catalog-lint --all-files

  node24-ready:
    name: workflows declare no removed Node runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cosmichackerx/node24-ready@v0.1.0
        with:
          path: .github action.yml
          fail-on: error

  dependabot-gaps:
    name: dependabot-gaps (released action, consumer test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cosmichackerx/dependabot-gaps@v0.2.0
        with:
          fail-on: warning
          # on pull requests: only gaps the PR introduces (needs fetch-depth: 0 above)
          pr-mode: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
